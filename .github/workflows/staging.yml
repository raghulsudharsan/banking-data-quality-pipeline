name: Banking Pipeline Staging

on:
  workflow_dispatch:

jobs:
  staging-check:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Verify staging configuration
        env:
          STAGING_DEMO_VALUE: ${{ secrets.STAGING_DEMO_VALUE }}
        run: |
          if [ -n "$STAGING_DEMO_VALUE" ]; then
            echo "Staging secret is configured."
          else
            echo "Staging secret is missing."
            exit 1
          fi
          echo "No secret value was printed."
